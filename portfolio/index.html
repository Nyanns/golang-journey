    <!-- ── Theme init: prevent FOUC ── -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('nindhita_theme');
          const theme = stored || 'mocha';
          document.documentElement.classList.remove('mocha', 'macchiato', 'frappe', 'latte');
          document.documentElement.classList.add(theme);
          const storedAccent = localStorage.getItem('nindhita_accent') || 'peach';
          document.documentElement.style.setProperty('--ctp-accent', `var(--ctp-${storedAccent})`);
        } catch (e) {}
      })();
    </script>
